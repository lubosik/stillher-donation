<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | StillHer Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #080810;
      --gold: #C9A96E;
      --white: #FFFFFF;
      --muted: rgba(255,255,255,0.35);
    }

    html { font-size: 16px; }
    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 25% 45%, rgba(201,169,110,0.06) 0%, transparent 55%);
      pointer-events: none;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      height: 48px; width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.65;
      display: block;
      margin: 0 auto 40px;
    }

    .gold-rule {
      width: 48px; height: 2px;
      background: var(--gold);
      border: none;
      display: block;
      margin: 0 auto 40px;
    }

    .thank-heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(72px, 14vw, 108px);
      color: var(--white);
      line-height: 1;
      margin-bottom: 24px;
    }

    #confirmed-amount {
      display: none;
      font-family: 'Raleway', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 32px;
    }

    .short-rule {
      width: 40px; height: 1px;
      background: var(--gold);
      border: none;
      display: block;
      margin: 0 auto 28px;
      opacity: 0.4;
    }

    .body-copy {
      font-family: 'Lora', serif;
      font-size: 17px;
      line-height: 1.9;
      color: rgba(255,255,255,0.70);
      margin-bottom: 28px;
    }

    .pull-quote {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(20px, 4vw, 28px);
      color: var(--gold);
      line-height: 1.4;
      margin-bottom: 36px;
    }

    .contact-note {
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 40px;
      line-height: 1.7;
    }
    .contact-note a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(201,169,110,0.30);
    }
    .contact-note a:hover { border-color: rgba(201,169,110,0.65); }

    .cta-return {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid rgba(201,169,110,0.45);
      border-radius: 2px;
      padding: 13px 32px;
      transition: background 0.25s;
    }
    .cta-return:hover { background: rgba(201,169,110,0.10); }

    .footer-note {
      margin-top: 72px;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
    }

    @media (max-width: 480px) {
      .thank-heading { font-size: 64px; }
      .body-copy { font-size: 15px; }
      .cta-return { padding: 12px 24px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <img src="../stillher-landing/images/logo-dark.svg" alt="StillHer Foundation" class="logo">

    <hr class="gold-rule">

    <h1 class="thank-heading">Thank you.</h1>

    <div id="confirmed-amount"></div>

    <hr class="short-rule">

    <p class="body-copy">
      Your gift has been received.<br>
      A warm message from the StillHer Foundation is on its way to your inbox.
    </p>

    <p class="pull-quote">She is still her. And now, so is her voice.</p>

    <p class="contact-note">
      Questions? <a href="mailto:hello@stillherfoundation.org">hello@stillherfoundation.org</a>
    </p>

    <a href="../stillher-landing/index.html" class="cta-return">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      RETURN TO DOCUMENTARY
    </a>

    <p class="footer-note">2025 StillHer Foundation</p>

  </div>

  <script>
    const stripe = Stripe('pk_test_PLACEHOLDER');
    const params = new URLSearchParams(window.location.search);
    const cs = params.get('payment_intent_client_secret');
    if (cs) {
      stripe.retrievePaymentIntent(cs).then(({ paymentIntent }) => {
        if (paymentIntent && paymentIntent.status === 'succeeded') {
          const amt = (paymentIntent.amount / 100).toFixed(2);
          const el = document.getElementById('confirmed-amount');
          el.textContent = 'YOUR GIFT: $' + amt;
          el.style.display = 'block';
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
